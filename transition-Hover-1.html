<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>transition-Hover</title>
    <style>
    [popover] {
        opacity: 0;
        transform: scaleX(0);
        transition: opacity 0.7s, transform 0.7s;
    }

    button:hover + [popover] {
        opacity: 1;
        transform: scaleX(1);
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }

    button {
        font-size: 1rem;
        padding: 10px 20px;
        cursor: pointer;
    }

    [popover] {
        margin-top: 10px;
        padding: 10px;
        background-color: #f0f0f0;
        border: 1px solid #ccc;
        border-radius: 5px;
        display: inline-block;
    }
    </style>
</head>
<body>
    <button>Show the popover</button>
    <div popover="true">I'm a Popover! I should animate.</div>
</body>
</html>
