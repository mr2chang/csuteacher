<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Transition Images</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      justify-content: center;
    }
    .image-wrapper {
      width: 300px;
      height: 200px;
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      transform: scale(1.1);
    }
    .image-wrapper:hover img {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Example Image Placeholders -->
    <div class="image-wrapper"><img data-src="https://via.placeholder.com/300x200" alt="Placeholder1"></div>
    <div class="image-wrapper"><img data-src="https://via.placeholder.com/300x200/ff6347" alt="Placeholder2"></div>
    <div class="image-wrapper"><img data-src="https://via.placeholder.com/300x200/4682b4" alt="Placeholder3"></div>
    <div class="image-wrapper"><img data-src="https://via.placeholder.com/300x200/3cb371" alt="Placeholder4"></div>
    <div class="image-wrapper"><img data-src="https://via.placeholder.com/300x200/dc143c" alt="Placeholder5"></div>
    <!-- Add more images as needed -->
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const images = document.querySelectorAll('img[data-src]');

      const loadImage = (img) => {
        const src = img.getAttribute('data-src');
        if (!src) return;

        img.src = src;
        img.onload = () => {
          img.removeAttribute('data-src');
        };
      };

      images.forEach(img => {
        loadImage(img);
      });
    });
  </script>
</body>
</html>
