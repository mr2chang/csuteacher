<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Bootstrap Carousel Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS（官方 CDN） -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- 自訂 CSS -->
    <link rel="stylesheet" href="styler_bootstrip.css" />
</head>
<body>

    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-light navbg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Mr2 James Site</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要內容容器 -->
    <div class="container my-4">

        <!-- 輪播區塊 -->
        <!-- data-bs-ride="carousel" 代表自動輪播 -->
        <!-- data-bs-interval="4000" 每 4 秒換一張，可自行調整 -->
        <div id="demo" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">

            <!-- 指示點 / 小圓點 -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#demo" data-bs-slide-to="0"
                        class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="3"
                        aria-label="Slide 4"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="4"
                        aria-label="Slide 5"></button>
            </div>

            <!-- 輪播圖片本體，一定要放在 .carousel-inner 裡 -->
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="www/images/img_banner01.jpg" class="d-block w-100" alt="Banner 1">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>第1張圖片標題</h5>
                        <p>這是第1張輪播圖片的說明文字。</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="www/images/img_banner02.jpg" class="d-block w-100" alt="Banner 2">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>第2張圖片標題</h5>
                        <p>這是第2張輪播圖片的說明文字。</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="www/images/img_banner03.jpg" class="d-block w-100" alt="Banner 3">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>第3張圖片標題</h5>
                        <p>這是第3張輪播圖片的說明文字。</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="www/images/img_banner04.jpg" class="d-block w-100" alt="Banner 4">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>第4張圖片標題</h5>
                        <p>這是第3張輪播圖片的說明文字。</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="www/images/img_banner05.jpg" class="d-block w-100" alt="Banner 5">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>第5張圖片標題</h5>
                        <p>這是第5張輪播圖片的說明文字。</p>
                    </div>
                </div>
            </div>

            <!-- 左右控制按鈕 -->
            <button class="carousel-control-prev" type="button"
                    data-bs-target="#demo" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>

            <button class="carousel-control-next" type="button"
                    data-bs-target="#demo" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>

        </div><!-- /#demo -->

    </div><!-- /.container -->

    <!-- Bootstrap JS（一定要，有含 Popper） -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
