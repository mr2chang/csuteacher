<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>transition-Hover</title>
    <style type="text/css">
    .all-center {
        text-align: center;
    }
    
    .target {
        font-size: 2rem;
        background-color: rgb(4, 113, 246);
        transition: background-color 2s 100ms;
        display: inline-block;
        padding: 10px 20px;
        margin: 20px auto;
    }
      
    .target:hover {
        background-color: darkorange;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    </style>
</head>
<body>
    <div class="all-center">
        <a class="target">Hover over me</a>
    </div>
</body>
</html>
